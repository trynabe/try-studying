<svg viewBox="0 0 720 330" role="img" aria-labelledby="hierarchy-title hierarchy-desc" xmlns="http://www.w3.org/2000/svg"><style>svg{--text:#392f27;--muted:#786a57;--accent:#803b3d;--panel2:#eee4d2;--border:#c5b497;font-family:'PT Serif',Georgia,serif;background:#fcf8ef}text{fill:var(--text)}.d-box{fill:var(--panel2);stroke:var(--border);stroke-width:1.6}.d-accent{fill:var(--panel2);stroke:var(--accent);stroke-width:2.5}.d-line{stroke:var(--muted);stroke-width:1.8;fill:none}.d-arrow{fill:var(--muted);stroke:none}.d-bold{font-weight:700}.d-muted{fill:var(--muted)}</style><title id="hierarchy-title">hierarchy</title><desc id="hierarchy-desc">ลำดับชั้นช่วยให้ข้อมูลที่ใช้บ่อยอยู่ในหน่วยความจำที่เร็ว ข้อมูลทั้งหมดไม่จำเป็นต้องอยู่ในชั้นที่เร็วที่สุดพร้อมกัน ความเร็วและขนาดเป็นแนวโน้มโดยทั่วไป</desc><defs><marker id="review-arrow-hierarchy" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" class="d-arrow"/></marker></defs><rect x="274" y="32" width="172" height="53" rx="4" class="d-box"/><text x="360" y="66" font-size="22" class="d-bold" text-anchor="middle">Registers</text><rect x="210" y="98" width="300" height="53" rx="4" class="d-box"/><text x="360" y="132" font-size="22" class="d-bold" text-anchor="middle">L1 / L2 / L3 cache</text><rect x="145" y="164" width="430" height="53" rx="4" class="d-box"/><text x="360" y="198" font-size="22" class="d-bold" text-anchor="middle">DRAM</text><rect x="80" y="230" width="560" height="53" rx="4" class="d-box"/><text x="360" y="264" font-size="22" class="d-bold" text-anchor="middle">SSD / HDD</text><line x1="56" y1="246" x2="56" y2="52" class="d-line"  marker-end="url(#review-arrow-hierarchy)"/><text x="56" y="285" font-size="17" class="" text-anchor="middle">Faster</text><line x1="664" y1="52" x2="664" y2="246" class="d-line"  marker-end="url(#review-arrow-hierarchy)"/><text x="664" y="285" font-size="17" class="" text-anchor="middle">Larger</text><text x="360" y="319" font-size="18" class="d-muted" text-anchor="middle">Keep frequently used data close to the CPU</text></svg>