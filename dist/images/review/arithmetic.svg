<svg viewBox="0 0 720 310" role="img" aria-labelledby="arithmetic-title arithmetic-desc" xmlns="http://www.w3.org/2000/svg"><style>svg{--text:#392f27;--muted:#786a57;--accent:#803b3d;--panel2:#eee4d2;--border:#c5b497;font-family:'PT Serif',Georgia,serif;background:#fcf8ef}text{fill:var(--text)}.d-box{fill:var(--panel2);stroke:var(--border);stroke-width:1.6}.d-accent{fill:var(--panel2);stroke:var(--accent);stroke-width:2.5}.d-line{stroke:var(--muted);stroke-width:1.8;fill:none}.d-arrow{fill:var(--muted);stroke:none}.d-bold{font-weight:700}.d-muted{fill:var(--muted)}</style><title id="arithmetic-title">arithmetic</title><desc id="arithmetic-desc">ตัวอย่างเสริม DAXPY แบบ double: ต่อหนึ่ง element มี 1 multiply และ 1 add รวม 2 FLOPs และอ่าน X, อ่าน Y, เขียน Y รวม 24 bytes จึงได้ 2/24 ≈ 0.0833 FLOP/byte สมมติไม่นับ scalar ที่ใช้ซ้ำและไม่เพิ่ม traffic จาก write-allocate; ปริมาณจริงขึ้นกับระดับ memory ที่นับ</desc><defs><marker id="review-arrow-arithmetic" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" class="d-arrow"/></marker></defs><text x="360" y="32" font-size="26" class="d-bold" text-anchor="middle">Yᵢ = a Xᵢ + Yᵢ</text><rect x="20" y="65" width="200" height="85" rx="4" class="d-box"/><text x="120" y="93" font-size="21" class="d-bold" text-anchor="middle">Read X</text><text x="120" y="118" font-size="17" class="" text-anchor="middle">8 bytes</text><rect x="260" y="65" width="200" height="85" rx="4" class="d-box"/><text x="360" y="93" font-size="21" class="d-bold" text-anchor="middle">Read Y</text><text x="360" y="118" font-size="17" class="" text-anchor="middle">8 bytes</text><rect x="500" y="65" width="200" height="85" rx="4" class="d-box"/><text x="600" y="93" font-size="21" class="d-bold" text-anchor="middle">Write Y</text><text x="600" y="118" font-size="17" class="" text-anchor="middle">8 bytes</text><text x="360" y="201" font-size="22" class="" text-anchor="middle">1 multiply + 1 add = 2 FLOPs</text><text x="360" y="244" font-size="21" class="" text-anchor="middle">Traffic = 8 + 8 + 8 = 24 bytes</text><text x="360" y="289" font-size="23" class="d-bold" text-anchor="middle">Intensity = 2 / 24 ≈ 0.0833 FLOP/byte</text></svg>