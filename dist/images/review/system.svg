<svg viewBox="0 0 720 370" role="img" aria-labelledby="system-title system-desc" xmlns="http://www.w3.org/2000/svg"><style>svg{--text:#392f27;--muted:#786a57;--accent:#803b3d;--panel2:#eee4d2;--border:#c5b497;font-family:'PT Serif',Georgia,serif;background:#fcf8ef}text{fill:var(--text)}.d-box{fill:var(--panel2);stroke:var(--border);stroke-width:1.6}.d-accent{fill:var(--panel2);stroke:var(--accent);stroke-width:2.5}.d-line{stroke:var(--muted);stroke-width:1.8;fill:none}.d-arrow{fill:var(--muted);stroke:none}.d-bold{font-weight:700}.d-muted{fill:var(--muted)}</style><title id="system-title">system</title><desc id="system-desc">CPU ประมวลผลคำสั่งในหน่วยความจำ รับข้อมูลผ่าน Input และส่งผลผ่าน Output ส่วน Storage เก็บข้อมูลระยะยาว ลูกศรแสดงทางเดินข้อมูลโดยย่อ</desc><defs><marker id="review-arrow-system" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" class="d-arrow"/></marker></defs><rect x="250" y="20" width="220" height="70" rx="4" class="d-box"/><text x="360" y="48" font-size="21" class="d-bold" text-anchor="middle">Memory</text><text x="360" y="73" font-size="17" class="" text-anchor="middle">Instructions + data</text><rect x="230" y="145" width="260" height="115" rx="4" class="d-box"/><text x="360" y="173" font-size="21" class="d-bold" text-anchor="middle">CPU</text><rect x="247" y="184" width="106" height="42" rx="4" class="d-box"/><rect x="367" y="184" width="106" height="42" rx="4" class="d-box"/><text x="300" y="211" font-size="19" class="" text-anchor="middle">ALU</text><text x="420" y="211" font-size="19" class="" text-anchor="middle">Control</text><text x="360" y="246" font-size="17" class="" text-anchor="middle">Registers</text><rect x="20" y="160" width="155" height="78" rx="4" class="d-box"/><text x="97.5" y="188" font-size="21" class="d-bold" text-anchor="middle">Input</text><text x="97.5" y="213" font-size="17" class="" text-anchor="middle">Data in</text><rect x="545" y="160" width="155" height="78" rx="4" class="d-box"/><text x="622.5" y="188" font-size="21" class="d-bold" text-anchor="middle">Output</text><text x="622.5" y="213" font-size="17" class="" text-anchor="middle">Result out</text><rect x="250" y="298" width="220" height="60" rx="4" class="d-box"/><text x="360" y="326" font-size="21" class="d-bold" text-anchor="middle">Storage</text><line x1="175" y1="199" x2="226" y2="199" class="d-line"  marker-end="url(#review-arrow-system)"/><line x1="490" y1="199" x2="541" y2="199" class="d-line"  marker-end="url(#review-arrow-system)"/><line x1="342" y1="145" x2="342" y2="94" class="d-line"  marker-end="url(#review-arrow-system)"/><line x1="378" y1="90" x2="378" y2="141" class="d-line"  marker-end="url(#review-arrow-system)"/><line x1="350" y1="260" x2="350" y2="294" class="d-line"  marker-end="url(#review-arrow-system)"/><line x1="385" y1="298" x2="385" y2="264" class="d-line"  marker-end="url(#review-arrow-system)"/></svg>