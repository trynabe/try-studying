<svg viewBox="0 0 720 270" role="img" aria-labelledby="cache-title cache-desc" xmlns="http://www.w3.org/2000/svg"><style>svg{--text:#392f27;--muted:#786a57;--accent:#803b3d;--panel2:#eee4d2;--border:#c5b497;font-family:'PT Serif',Georgia,serif;background:#fcf8ef}text{fill:var(--text)}.d-box{fill:var(--panel2);stroke:var(--border);stroke-width:1.6}.d-accent{fill:var(--panel2);stroke:var(--accent);stroke-width:2.5}.d-line{stroke:var(--muted);stroke-width:1.8;fill:none}.d-arrow{fill:var(--muted);stroke:none}.d-bold{font-weight:700}.d-muted{fill:var(--muted)}</style><title id="cache-title">cache</title><desc id="cache-desc">ตัวอย่างเสริม: address แบบ byte-addressed 32 บิต, cache เฉพาะข้อมูล 16 KiB, 4-way และ block 64 B จึงมี 64 sets → Index 6 บิต, Offset 6 บิต, Tag 20 บิต ไม่รวมพื้นที่ tag/valid/dirty ในความจุข้อมูล</desc><defs><marker id="review-arrow-cache" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" class="d-arrow"/></marker></defs><text x="360" y="29" font-size="19" class="" text-anchor="middle">32-bit address · 16 KiB · 4-way · 64 B/block</text><rect x="20" y="62" width="425" height="90" rx="4" class="d-accent"/><rect x="445" y="62" width="127" height="90" rx="4" class="d-box"/><rect x="572" y="62" width="128" height="90" rx="4" class="d-box"/><text x="232" y="98" font-size="24" class="d-bold" text-anchor="middle">TAG</text><text x="232" y="131" font-size="21" class="" text-anchor="middle">20 bits</text><text x="508" y="98" font-size="20" class="d-bold" text-anchor="middle">INDEX</text><text x="508" y="131" font-size="20" class="" text-anchor="middle">6 bits</text><text x="636" y="98" font-size="19" class="d-bold" text-anchor="middle">OFFSET</text><text x="636" y="131" font-size="20" class="" text-anchor="middle">6 bits</text><text x="360" y="190" font-size="22" class="" text-anchor="middle">Sets = 16,384 ÷ (4 × 64) = 64</text><text x="360" y="233" font-size="22" class="" text-anchor="middle">Tag = 32 − 6 − 6 = 20 bits</text></svg>