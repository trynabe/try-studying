<svg viewBox="0 0 720 390" role="img" aria-labelledby="raid-title raid-desc" xmlns="http://www.w3.org/2000/svg"><style>svg{--text:#392f27;--muted:#786a57;--accent:#803b3d;--panel2:#eee4d2;--border:#c5b497;font-family:'PT Serif',Georgia,serif;background:#fcf8ef}text{fill:var(--text)}.d-box{fill:var(--panel2);stroke:var(--border);stroke-width:1.6}.d-accent{fill:var(--panel2);stroke:var(--accent);stroke-width:2.5}.d-line{stroke:var(--muted);stroke-width:1.8;fill:none}.d-arrow{fill:var(--muted);stroke:none}.d-bold{font-weight:700}.d-muted{fill:var(--muted)}</style><title id="raid-title">raid</title><desc id="raid-desc">ตัวอย่าง 4 ดิสก์ขนาดเท่ากัน: หนึ่ง stripe มีข้อมูล 3 ส่วนและ parity 1 ส่วน โดยตำแหน่ง parity สลับดิสก์ ความจุใช้งานประมาณ 3S และทนดิสก์เสียได้ 1 ลูก ตามสมมติฐานนี้ RAID ไม่แทนการสำรองข้อมูล</desc><defs><marker id="review-arrow-raid" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" class="d-arrow"/></marker></defs><text x="98" y="35" font-size="21" class="d-bold" text-anchor="middle">Disk 1</text><text x="273" y="35" font-size="21" class="d-bold" text-anchor="middle">Disk 2</text><text x="448" y="35" font-size="21" class="d-bold" text-anchor="middle">Disk 3</text><text x="623" y="35" font-size="21" class="d-bold" text-anchor="middle">Disk 4</text><rect x="23" y="62" width="150" height="49" rx="4" class="d-box"/><text x="98" y="93" font-size="22" class="d-bold" text-anchor="middle">A1</text><rect x="198" y="62" width="150" height="49" rx="4" class="d-box"/><text x="273" y="93" font-size="22" class="d-bold" text-anchor="middle">A2</text><rect x="373" y="62" width="150" height="49" rx="4" class="d-box"/><text x="448" y="93" font-size="22" class="d-bold" text-anchor="middle">A3</text><rect x="548" y="62" width="150" height="49" rx="4" class="d-accent"/><text x="623" y="93" font-size="22" class="d-bold" text-anchor="middle">P(A)</text><rect x="23" y="123" width="150" height="49" rx="4" class="d-box"/><text x="98" y="154" font-size="22" class="d-bold" text-anchor="middle">B1</text><rect x="198" y="123" width="150" height="49" rx="4" class="d-box"/><text x="273" y="154" font-size="22" class="d-bold" text-anchor="middle">B2</text><rect x="373" y="123" width="150" height="49" rx="4" class="d-accent"/><text x="448" y="154" font-size="22" class="d-bold" text-anchor="middle">P(B)</text><rect x="548" y="123" width="150" height="49" rx="4" class="d-box"/><text x="623" y="154" font-size="22" class="d-bold" text-anchor="middle">B3</text><rect x="23" y="184" width="150" height="49" rx="4" class="d-box"/><text x="98" y="215" font-size="22" class="d-bold" text-anchor="middle">C1</text><rect x="198" y="184" width="150" height="49" rx="4" class="d-accent"/><text x="273" y="215" font-size="22" class="d-bold" text-anchor="middle">P(C)</text><rect x="373" y="184" width="150" height="49" rx="4" class="d-box"/><text x="448" y="215" font-size="22" class="d-bold" text-anchor="middle">C2</text><rect x="548" y="184" width="150" height="49" rx="4" class="d-box"/><text x="623" y="215" font-size="22" class="d-bold" text-anchor="middle">C3</text><rect x="23" y="245" width="150" height="49" rx="4" class="d-accent"/><text x="98" y="276" font-size="22" class="d-bold" text-anchor="middle">P(D)</text><rect x="198" y="245" width="150" height="49" rx="4" class="d-box"/><text x="273" y="276" font-size="22" class="d-bold" text-anchor="middle">D1</text><rect x="373" y="245" width="150" height="49" rx="4" class="d-box"/><text x="448" y="276" font-size="22" class="d-bold" text-anchor="middle">D2</text><rect x="548" y="245" width="150" height="49" rx="4" class="d-box"/><text x="623" y="276" font-size="22" class="d-bold" text-anchor="middle">D3</text><text x="360" y="340" font-size="22" class="" text-anchor="middle">Usable capacity = (4 − 1) × S = 3S</text><text x="360" y="375" font-size="18" class="d-muted" text-anchor="middle">Distributed parity · tolerates one disk failure</text></svg>