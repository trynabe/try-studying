<svg viewBox="0 0 720 290" role="img" aria-labelledby="cycle-title cycle-desc" xmlns="http://www.w3.org/2000/svg"><style>svg{--text:#392f27;--muted:#786a57;--accent:#803b3d;--panel2:#eee4d2;--border:#c5b497;font-family:'PT Serif',Georgia,serif;background:#fcf8ef}text{fill:var(--text)}.d-box{fill:var(--panel2);stroke:var(--border);stroke-width:1.6}.d-accent{fill:var(--panel2);stroke:var(--accent);stroke-width:2.5}.d-line{stroke:var(--muted);stroke-width:1.8;fill:none}.d-arrow{fill:var(--muted);stroke:none}.d-bold{font-weight:700}.d-muted{fill:var(--muted)}</style><title id="cycle-title">cycle</title><desc id="cycle-desc">ดึงคำสั่ง → ถอดรหัส → ทำงาน → อัปเดตผลหรือสถานะ แล้วไปคำสั่งถัดไป รูปนี้เป็นลำดับงานเชิงแนวคิด ไม่ได้กำหนดว่าทุกคำสั่งใช้ 4 clock เมื่อรับ interrupt ต้องเก็บสถานะที่จำเป็นก่อนทำ handler และคืนสถานะเพื่อกลับมาทำต่อ</desc><defs><marker id="review-arrow-cycle" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" class="d-arrow"/></marker></defs><rect x="17" y="42" width="155" height="86" rx="4" class="d-box"/><text x="94.5" y="70" font-size="21" class="d-bold" text-anchor="middle">Fetch</text><text x="94.5" y="95" font-size="17" class="" text-anchor="middle">PC → IR</text><rect x="194" y="42" width="155" height="86" rx="4" class="d-box"/><text x="271.5" y="70" font-size="21" class="d-bold" text-anchor="middle">Decode</text><text x="271.5" y="95" font-size="17" class="" text-anchor="middle">Read operands</text><rect x="371" y="42" width="155" height="86" rx="4" class="d-box"/><text x="448.5" y="70" font-size="21" class="d-bold" text-anchor="middle">Execute</text><text x="448.5" y="95" font-size="17" class="" text-anchor="middle">ALU / memory</text><rect x="548" y="42" width="155" height="86" rx="4" class="d-box"/><text x="625.5" y="70" font-size="21" class="d-bold" text-anchor="middle">Update state</text><text x="625.5" y="95" font-size="17" class="" text-anchor="middle">Save if needed</text><line x1="173" y1="85" x2="191" y2="85" class="d-line"  marker-end="url(#review-arrow-cycle)"/><line x1="350" y1="85" x2="368" y2="85" class="d-line"  marker-end="url(#review-arrow-cycle)"/><line x1="527" y1="85" x2="545" y2="85" class="d-line"  marker-end="url(#review-arrow-cycle)"/><path d="M626 128V159H95V132" class="d-line" marker-end="url(#review-arrow-cycle)"/><rect x="128" y="202" width="464" height="66" rx="4" class="d-box"/><text x="360" y="230" font-size="21" class="d-bold" text-anchor="middle">Interrupt</text><text x="360" y="255" font-size="17" class="" text-anchor="middle">Save state → Handler → Restore state</text><line x1="361" y1="162" x2="361" y2="198" class="d-line" stroke-dasharray="5 5" marker-end="url(#review-arrow-cycle)"/></svg>