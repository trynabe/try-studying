<svg viewBox="0 0 720 370" role="img" aria-labelledby="io-title io-desc" xmlns="http://www.w3.org/2000/svg"><style>svg{--text:#392f27;--muted:#786a57;--accent:#803b3d;--panel2:#eee4d2;--border:#c5b497;font-family:'PT Serif',Georgia,serif;background:#fcf8ef}text{fill:var(--text)}.d-box{fill:var(--panel2);stroke:var(--border);stroke-width:1.6}.d-accent{fill:var(--panel2);stroke:var(--accent);stroke-width:2.5}.d-line{stroke:var(--muted);stroke-width:1.8;fill:none}.d-arrow{fill:var(--muted);stroke:none}.d-bold{font-weight:700}.d-muted{fill:var(--muted)}</style><title id="io-title">io</title><desc id="io-desc">Polling ให้ CPU ถามสถานะซ้ำ ๆ; Interrupt ให้อุปกรณ์แจ้งเมื่อพร้อม แต่ CPU ยังอาจต้องคัดลอกข้อมูล; DMA ให้ตัวควบคุมขนข้อมูลระหว่างอุปกรณ์กับ memory หลัง CPU ตั้งค่างาน และมักแจ้งเมื่อเสร็จ</desc><defs><marker id="review-arrow-io" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" class="d-arrow"/></marker></defs><rect x="18" y="14" width="208" height="342" rx="4" class="d-box"/><text x="122" y="44" font-size="23" class="d-bold" text-anchor="middle">Polling</text><rect x="256" y="14" width="208" height="342" rx="4" class="d-box"/><text x="360" y="44" font-size="23" class="d-bold" text-anchor="middle">Interrupt</text><rect x="494" y="14" width="208" height="342" rx="4" class="d-box"/><text x="598" y="44" font-size="23" class="d-bold" text-anchor="middle">DMA</text><rect x="37" y="65" width="170" height="67" rx="4" class="d-box"/><text x="122" y="93" font-size="21" class="d-bold" text-anchor="middle">CPU</text><rect x="37" y="253" width="170" height="65" rx="4" class="d-box"/><text x="122" y="281" font-size="21" class="d-bold" text-anchor="middle">Device</text><line x1="94" y1="137" x2="94" y2="248" class="d-line"  marker-end="url(#review-arrow-io)"/><line x1="150" y1="248" x2="150" y2="137" class="d-line"  marker-end="url(#review-arrow-io)"/><text x="122" y="185" font-size="18" class="" text-anchor="middle">Ready?</text><text x="122" y="211" font-size="16" class="" text-anchor="middle">Ask repeatedly</text><rect x="275" y="65" width="170" height="67" rx="4" class="d-box"/><text x="360" y="93" font-size="21" class="d-bold" text-anchor="middle">CPU</text><rect x="275" y="253" width="170" height="65" rx="4" class="d-box"/><text x="360" y="281" font-size="21" class="d-bold" text-anchor="middle">Device</text><line x1="324" y1="248" x2="324" y2="137" class="d-line"  marker-end="url(#review-arrow-io)"/><line x1="390" y1="137" x2="390" y2="248" class="d-line"  marker-end="url(#review-arrow-io)"/><text x="360" y="185" font-size="18" class="" text-anchor="middle">IRQ ↑</text><text x="360" y="211" font-size="17" class="" text-anchor="middle">CPU copies ↓</text><rect x="513" y="65" width="170" height="60" rx="4" class="d-box"/><text x="598" y="93" font-size="21" class="d-bold" text-anchor="middle">CPU</text><rect x="531" y="171" width="134" height="58" rx="4" class="d-box"/><text x="598" y="199" font-size="21" class="d-bold" text-anchor="middle">DMA</text><rect x="505" y="284" width="87" height="58" rx="4" class="d-box"/><text x="548.5" y="312" font-size="21" class="d-bold" text-anchor="middle">Device</text><rect x="603" y="284" width="88" height="58" rx="4" class="d-box"/><text x="647" y="312" font-size="21" class="d-bold" text-anchor="middle">Memory</text><line x1="598" y1="129" x2="598" y2="167" class="d-line"  marker-end="url(#review-arrow-io)"/><text x="644" y="150" font-size="16" class="" text-anchor="middle">Setup</text><line x1="549" y1="280" x2="549" y2="234" class="d-line"  marker-end="url(#review-arrow-io)"/><line x1="644" y1="234" x2="644" y2="279" class="d-line"  marker-end="url(#review-arrow-io)"/><path d="M671 196H692V97H687" class="d-line" marker-end="url(#review-arrow-io)"/></svg>