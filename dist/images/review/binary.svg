<svg viewBox="0 0 720 300" role="img" aria-labelledby="binary-title binary-desc" xmlns="http://www.w3.org/2000/svg"><style>svg{--text:#392f27;--muted:#786a57;--accent:#803b3d;--panel2:#eee4d2;--border:#c5b497;font-family:'PT Serif',Georgia,serif;background:#fcf8ef}text{fill:var(--text)}.d-box{fill:var(--panel2);stroke:var(--border);stroke-width:1.6}.d-accent{fill:var(--panel2);stroke:var(--accent);stroke-width:2.5}.d-line{stroke:var(--muted);stroke-width:1.8;fill:none}.d-arrow{fill:var(--muted);stroke:none}.d-bold{font-weight:700}.d-muted{fill:var(--muted)}</style><title id="binary-title">binary</title><desc id="binary-desc">ตัวอย่างเสริมขนาด 8 บิต: 10110010₂ คือ 178 เมื่ออ่านแบบ unsigned แต่เป็น −78 เมื่ออ่านแบบ two’s complement ต้องดูชนิดข้อมูลก่อนคำนวณ ตัวอย่างนี้ไม่ได้หมายความว่า register ของ RV64 มีเพียง 8 บิต</desc><defs><marker id="review-arrow-binary" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" class="d-arrow"/></marker></defs><text x="360" y="30" font-size="25" class="d-bold" text-anchor="middle">10110010₂ = B2₁₆</text><rect x="20" y="57" width="79" height="58" rx="4" class="d-accent"/><text x="59" y="95" font-size="27" class="d-bold" text-anchor="middle">1</text><text x="59" y="143" font-size="18" class="" text-anchor="middle">128</text><rect x="105" y="57" width="79" height="58" rx="4" class="d-box"/><text x="144" y="95" font-size="27" class="d-bold" text-anchor="middle">0</text><text x="144" y="143" font-size="18" class="" text-anchor="middle">64</text><rect x="190" y="57" width="79" height="58" rx="4" class="d-box"/><text x="229" y="95" font-size="27" class="d-bold" text-anchor="middle">1</text><text x="229" y="143" font-size="18" class="" text-anchor="middle">32</text><rect x="275" y="57" width="79" height="58" rx="4" class="d-box"/><text x="314" y="95" font-size="27" class="d-bold" text-anchor="middle">1</text><text x="314" y="143" font-size="18" class="" text-anchor="middle">16</text><rect x="360" y="57" width="79" height="58" rx="4" class="d-box"/><text x="399" y="95" font-size="27" class="d-bold" text-anchor="middle">0</text><text x="399" y="143" font-size="18" class="" text-anchor="middle">8</text><rect x="445" y="57" width="79" height="58" rx="4" class="d-box"/><text x="484" y="95" font-size="27" class="d-bold" text-anchor="middle">0</text><text x="484" y="143" font-size="18" class="" text-anchor="middle">4</text><rect x="530" y="57" width="79" height="58" rx="4" class="d-box"/><text x="569" y="95" font-size="27" class="d-bold" text-anchor="middle">1</text><text x="569" y="143" font-size="18" class="" text-anchor="middle">2</text><rect x="615" y="57" width="79" height="58" rx="4" class="d-box"/><text x="654" y="95" font-size="27" class="d-bold" text-anchor="middle">0</text><text x="654" y="143" font-size="18" class="" text-anchor="middle">1</text><text x="360" y="180" font-size="22" class="" text-anchor="middle">Unsigned: 128 + 32 + 16 + 2 = 178</text><text x="360" y="220" font-size="22" class="" text-anchor="middle">Signed: −128 + 32 + 16 + 2 = −78</text><text x="360" y="268" font-size="18" class="d-muted" text-anchor="middle">Same bits · interpret the type first</text></svg>