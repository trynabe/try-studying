<svg viewBox="0 0 720 335" role="img" aria-labelledby="flynn-title flynn-desc" xmlns="http://www.w3.org/2000/svg"><style>svg{--text:#392f27;--muted:#786a57;--accent:#803b3d;--panel2:#eee4d2;--border:#c5b497;font-family:'PT Serif',Georgia,serif;background:#fcf8ef}text{fill:var(--text)}.d-box{fill:var(--panel2);stroke:var(--border);stroke-width:1.6}.d-accent{fill:var(--panel2);stroke:var(--accent);stroke-width:2.5}.d-line{stroke:var(--muted);stroke-width:1.8;fill:none}.d-arrow{fill:var(--muted);stroke:none}.d-bold{font-weight:700}.d-muted{fill:var(--muted)}</style><title id="flynn-title">flynn</title><desc id="flynn-desc">SISD: คำสั่งเดียว–ข้อมูลเดียว; SIMD: คำสั่งเดียวกับหลายข้อมูล; MIMD: หลายคำสั่งและหลายข้อมูล; MISD พบไม่บ่อย การจัดประเภทนี้ดู instruction/data streams จึงต้องระบุระดับที่กำลังพิจารณา</desc><defs><marker id="review-arrow-flynn" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" class="d-arrow"/></marker></defs><text x="289" y="31" font-size="19" class="d-bold" text-anchor="middle">1 instruction stream</text><text x="565" y="31" font-size="19" class="d-bold" text-anchor="middle">Many instruction streams</text><text x="80" y="109" font-size="17" class="" text-anchor="middle">1 data stream</text><text x="80" y="243" font-size="17" class="" text-anchor="middle">Many data</text><text x="80" y="267" font-size="17" class="" text-anchor="middle">streams</text><rect x="168" y="59" width="244" height="101" rx="4" class="d-box"/><text x="290" y="87" font-size="21" class="d-bold" text-anchor="middle">SISD</text><text x="290" y="112" font-size="17" class="" text-anchor="middle">One operation at a time</text><rect x="440" y="59" width="264" height="101" rx="4" class="d-box"/><text x="572" y="87" font-size="21" class="d-bold" text-anchor="middle">MISD</text><text x="572" y="112" font-size="17" class="" text-anchor="middle">Uncommon category</text><rect x="168" y="198" width="244" height="108" rx="4" class="d-box"/><text x="290" y="226" font-size="21" class="d-bold" text-anchor="middle">SIMD</text><text x="290" y="251" font-size="17" class="" text-anchor="middle">Same operation</text><text x="290" y="274" font-size="17" class="" text-anchor="middle">across multiple data</text><rect x="440" y="198" width="264" height="108" rx="4" class="d-box"/><text x="572" y="226" font-size="21" class="d-bold" text-anchor="middle">MIMD</text><text x="572" y="251" font-size="17" class="" text-anchor="middle">Independent instructions</text><text x="572" y="274" font-size="17" class="" text-anchor="middle">and independent data</text></svg>